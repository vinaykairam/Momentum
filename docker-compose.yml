services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/momentum.db
      SEED_DEMO_DATA: "false"
      CORS_ORIGINS: '["http://localhost","http://localhost:8080","http://127.0.0.1:8080"]'
    volumes:
      - momentum_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional — not used by the app today (SQLite is default)
  postgres:
    image: postgres:16-alpine
    profiles:
      - extras
    environment:
      POSTGRES_USER: momentum
      POSTGRES_PASSWORD: momentum
      POSTGRES_DB: momentum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles:
      - extras
    ports:
      - "6379:6379"

volumes:
  momentum_data:
  postgres_data:
